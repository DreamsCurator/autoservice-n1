<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Заявка — Autoservice</title>
    <meta
      name="description"
      content="Форма заявки для тёплых клиентов Autoservice."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="orbs" aria-hidden="true">
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
      <span class="orb orb-c"></span>
      <span class="orb orb-d"></span>
      <span class="orb orb-e"></span>
      <span class="orb orb-f"></span>
      <span class="orb orb-g"></span>
      <span class="orb orb-h"></span>
      <span class="orb orb-i"></span>
      <span class="orb orb-j"></span>
      <span class="orb orb-k"></span>
      <span class="orb orb-l"></span>
    </div>

    <main class="page">
      <header class="intro" data-zone="шапка">
        <p class="eyebrow">Autoservice</p>
        <h1>Заявка для своих</h1>
        <p class="lede">
          Расскажите о задаче. Поля ниже уходят одним пакетом и остаются внутри контура.
        </p>
      </header>

      <form id="lead-form" class="sheet" novalidate>
        <p id="form-status" class="status" role="status" hidden></p>

        <section class="block" data-zone="контакт">
          <div class="block-head">
            <span>01</span>
            <h2>Контакт</h2>
          </div>
          <div class="grid">
            <label class="field">
              <span>Фамилия</span>
              <input name="last_name" autocomplete="family-name" maxlength="200" required />
              <small class="hint">Укажите фамилию</small>
            </label>
            <label class="field">
              <span>Имя</span>
              <input name="first_name" autocomplete="given-name" maxlength="200" required />
              <small class="hint">Укажите имя</small>
            </label>
            <label class="field span-2">
              <span>Отчество</span>
              <input name="middle_name" autocomplete="additional-name" maxlength="200" />
            </label>
          </div>
        </section>

        <section class="block" data-zone="бизнес">
          <div class="block-head">
            <span>02</span>
            <h2>Бизнес</h2>
          </div>
          <div class="grid">
            <label class="field span-2">
              <span>О бизнесе</span>
              <textarea
                name="business_info"
                rows="3"
                maxlength="4000"
                required
                placeholder="Чем занимаетесь и зачем вам услуга"
              ></textarea>
              <small class="hint">Расскажите о бизнесе</small>
            </label>
            <label class="field">
              <span>Ниша</span>
              <input
                name="business_niche"
                maxlength="500"
                required
                placeholder="Например, такси, дилер, частный клиент"
              />
              <small class="hint">Укажите нишу</small>
            </label>
            <fieldset class="field">
              <legend>Роль</legend>
              <div class="choice-row">
                <label class="choice-item">
                  <input type="radio" name="role" value="сотрудник" required />
                  <span>Сотрудник</span>
                </label>
                <label class="choice-item">
                  <input type="radio" name="role" value="руководитель" />
                  <span>Руководитель</span>
                </label>
              </div>
              <small class="hint">Выберите роль</small>
            </fieldset>
            <label class="field">
              <span>Размер компании</span>
              <select name="company_size" required>
                <option value="">Выберите</option>
                <option>ИП, 1–2 человека</option>
                <option>Небольшая компания, до 15 человек</option>
                <option>Средняя компания, около 50 человек</option>
                <option>Крупная компания или сеть</option>
              </select>
              <small class="hint">Укажите размер компании</small>
            </label>
            <label class="field">
              <span>Размер бизнеса</span>
              <select name="business_size" required>
                <option value="">Выберите</option>
                <option>Разовые частные заказы</option>
                <option>Малый бизнес</option>
                <option>Средний бизнес</option>
                <option>Крупный бизнес</option>
              </select>
              <small class="hint">Укажите размер бизнеса</small>
            </label>
          </div>
        </section>

        <section class="block" data-zone="задача">
          <div class="block-head">
            <span>03</span>
            <h2>Задача</h2>
          </div>
          <div class="grid">
            <label class="field span-2">
              <span>Услуга</span>
              <select name="product_interest" required>
                <option value="">Загрузка услуг…</option>
              </select>
              <small id="service-note" class="note"></small>
              <small class="hint">Выберите услугу</small>
            </label>
            <div class="field span-2">
              <div class="budget-head">
                <label for="budget">Бюджет</label>
                <output id="budget-value" for="budget">80 000 ₽</output>
              </div>
              <input
                id="budget"
                name="budget"
                type="range"
                min="10000"
                max="300000"
                step="5000"
                value="80000"
              />
            </div>
            <label class="field">
              <span>Тип задачи</span>
              <select name="task_type" required>
                <option value="">Выберите</option>
                <option>Разовая услуга</option>
                <option>Срочный ремонт или восстановление</option>
                <option>Обслуживание парка</option>
                <option>Премиальная отделка</option>
              </select>
              <small class="hint">Укажите тип задачи</small>
            </label>
            <label class="field">
              <span>Объём задачи</span>
              <select name="task_volume" required>
                <option value="">Выберите</option>
                <option>Один автомобиль, разовая работа</option>
                <option>Несколько машин время от времени</option>
                <option>Автопарк, постоянный поток</option>
              </select>
              <small class="hint">Укажите объём задачи</small>
            </label>
            <label class="field span-2">
              <span>Объём потребности</span>
              <select name="need_volume" required>
                <option value="">Выберите</option>
                <option>Одна услуга один раз</option>
                <option>Регулярно, несколько раз в месяц</option>
                <option>Постоянный контракт</option>
              </select>
              <small class="hint">Укажите объём потребности</small>
            </label>
            <label class="field span-2">
              <span>Срок исполнения заказа</span>
              <input
                name="deadline"
                maxlength="500"
                required
                placeholder="Например, до конца месяца"
              />
              <small class="hint">Укажите срок</small>
            </label>
          </div>
        </section>

        <section class="block" data-zone="связь">
          <div class="block-head">
            <span>04</span>
            <h2>Связь</h2>
          </div>
          <div class="grid">
            <label class="field">
              <span>Способ связи</span>
              <input
                name="contact_method"
                maxlength="200"
                required
                placeholder="Телефон, Telegram или почта"
              />
              <small class="hint">Укажите способ связи</small>
            </label>
            <label class="field">
              <span>Удобное время</span>
              <input
                name="convenient_time"
                maxlength="200"
                required
                placeholder="Будни после 18:00"
              />
              <small class="hint">Укажите удобное время</small>
            </label>
            <label class="field span-2">
              <span>Комментарий</span>
              <textarea name="comment" rows="3" maxlength="4000"></textarea>
            </label>
          </div>
        </section>

        <div class="submit-row">
          <button type="submit" data-track="отправить заявку">Отправить заявку</button>
          <p>Запись остаётся на этом сервере.</p>
        </div>
      </form>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
