# Единственный HTTP-вход снаружи.
# Страница — статический dist frontend. /api уходит во frontend,
# а оттуда во внутренний backend. Backend в сеть edge не входит.

server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $frontend_host frontend;
        proxy_http_version 1.1;
        proxy_pass http://$frontend_host:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
